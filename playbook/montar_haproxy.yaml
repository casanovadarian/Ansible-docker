---
- name: Configuracion base de repos uclv
  import_playbook: actualizacion_repos_uclv.yaml
  vars:
    target_hosts: lb

- name: Instalar y configurar HAProxy en el balanceador
  hosts: lb
  become: true
  vars:
    haproxy_frontend_name: kubernetes_frontend
    haproxy_backend_name: kubernetes_backend
    haproxy_listen_port: 6443
    haproxy_backend_servers:
      - name: master1
        address: 10.12.118.210:6443
      - name: master2
        address: 10.12.118.214:6443
      - name: master3
        address: 10.12.118.215:6443
  tasks:
    - name: Instalar HAProxy
      ansible.builtin.apt:
        name: haproxy
        state: present
        update_cache: yes

    - name: Crear configuración de HAProxy
      ansible.builtin.copy:
        dest: /etc/haproxy/haproxy.cfg
        mode: '0644'
        content: |
          global
              log /dev/log local0
              log /dev/log local1 notice
              chroot /var/lib/haproxy
              stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
              stats timeout 30s
              user haproxy
              group haproxy
              daemon

              # Default SSL material locations
              ca-base /etc/ssl/certs
              crt-base /etc/ssl/private

              # Default ciphers to use on SSL-enabled listening sockets.
              ssl-default-bind-ciphers EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH
              ssl-default-bind-options ssl-min-ver TLSv1.2

          defaults
              log global
              mode tcp
              option tcplog
              option dontlognull
              timeout connect 10s
              timeout client 1m
              timeout server 1m

          frontend {{ haproxy_frontend_name }}
              bind *:{{ haproxy_listen_port }}
              default_backend {{ haproxy_backend_name }}

          backend {{ haproxy_backend_name }}
              balance roundrobin
              {% for server in haproxy_backend_servers %}
              server {{ server.name }} {{ server.address }} check
              {% endfor %}

    - name: Validar configuración de HAProxy
      ansible.builtin.command: haproxy -c -f /etc/haproxy/haproxy.cfg
      register: haproxy_check
      changed_when: false

    - name: Habilitar y reiniciar HAProxy
      ansible.builtin.systemd:
        name: haproxy
        state: restarted
        enabled: true
