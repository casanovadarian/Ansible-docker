---
# roles/21nfs_provisioner/tasks/main.yml

- name: Agregar el repositorio Helm de NFS Subdir External Provisioner
  kubernetes.core.helm_repository:
    name: nfs-subdir-external-provisioner
    repo_url: https://kubernetes-sigs.github.io/nfs-subdir-external-provisioner/

- name: Instalar o Actualizar NFS Subdir External Provisioner con Helm
  kubernetes.core.helm:
    name: nfs-client
    chart_ref: nfs-subdir-external-provisioner/nfs-subdir-external-provisioner
    release_namespace: kube-system
    create_namespace: true
    update_repo_cache: yes  # Reemplaza de manera eficiente a 'helm repo update'
    values:
      nfs:
        server: "{{ nfs_server }}"
        path: "{{ nfs_path }}"
      storageClass:
        create: true
        defaultClass: "{{ storage_class_default }}"
        name: "{{ storage_class_name }}"
      reclaimPolicy: "{{ storage_reclaim_policy }}"
  register: helm_nfs_result
  retries: 5
  delay: 10
  until: helm_nfs_result is success