---
# roles/21nfs_provisioner/defaults/main.yml

# Configuración del Servidor NFS institucional
nfs_server: "10.12.118.204"
nfs_path: "/root/exports/kubernetes"

# Parámetros del StorageClass
storage_class_name: "nfs-client"
storage_class_default: true
storage_reclaim_policy: "Delete"

# Variables de Proxy heredadas
proxy_host: "{{ hostvars['localhost'].tinyproxy_host | default(hostvars['localhost']['ansible_default_ipv4']['address']) }}"
proxy_port: "{{ hostvars['localhost'].tinyproxy_port }}"
k8s_no_proxy: "localhost,127.0.0.1,10.12.0.0/16,*.uclv.cu,*.uclv.edu.cu,repos.uclv.edu.cu"