---
# roles/02tinyproxy/tasks/local.yml

- name: Actualizar repositorios en máquina local
  ansible.builtin.apt:
    update_cache: yes

- name: Instalar tinyproxy
  ansible.builtin.apt:
    name: tinyproxy
    state: present

- name: Configurar Bind en tinyproxy.conf
  ansible.builtin.lineinfile:
    path: /etc/tinyproxy/tinyproxy.conf
    regexp: "^Bind"
    line: "Bind 0.0.0.0"
    state: present
  notify: Reiniciar tinyproxy

- name: Configurar Port en tinyproxy.conf
  ansible.builtin.lineinfile:
    path: /etc/tinyproxy/tinyproxy.conf
    regexp: "^Port"
    line: "Port {{ tinyproxy_port }}"
    state: present
  notify: Reiniciar tinyproxy

- name: Permitir CONNECT a HTTPS en tinyproxy.conf
  ansible.builtin.lineinfile:
    path: /etc/tinyproxy/tinyproxy.conf
    regexp: '^ConnectPort[[:space:]]+443$'
    line: 'ConnectPort 443'
    insertafter: '^Port'
    state: present
  notify: Reiniciar tinyproxy

- name: Asegurar Allow localhost en tinyproxy.conf
  ansible.builtin.lineinfile:
    path: /etc/tinyproxy/tinyproxy.conf
    regexp: '^Allow[[:space:]]+127\.0\.0\.1$'
    line: 'Allow 127.0.0.1'
    state: present
  notify: Reiniciar tinyproxy

- name: Asegurar Allow IPv6 localhost en tinyproxy.conf
  ansible.builtin.lineinfile:
    path: /etc/tinyproxy/tinyproxy.conf
    regexp: '^Allow[[:space:]]+::1$'
    line: 'Allow ::1'
    state: present
  notify: Reiniciar tinyproxy

- name: Asegurar Allow para clientes en tinyproxy.conf
  ansible.builtin.lineinfile:
    path: /etc/tinyproxy/tinyproxy.conf
    regexp: '^Allow[[:space:]]+{{ item | regex_escape }}$'
    line: 'Allow {{ item }}'
    state: present
  loop: "{{ groups[target_hosts] | map('extract', hostvars, ['ansible_default_ipv4', 'address']) | list }}"
  notify: Reiniciar tinyproxy

# --- SECCIÓN DE FIREWALL (UFW / IPTABLES) ---
- name: Permitir tráfico UFW desde IPs clientes al puerto {{ tinyproxy_port }}
  community.general.ufw:
    rule: allow
    from_ip: "{{ item }}"
    to_port: '{{ tinyproxy_port }}'
    proto: tcp
  loop: "{{ groups[target_hosts] | map('extract', hostvars, ['ansible_default_ipv4', 'address']) | list }}"
  when: lookup('pipe', 'command -v ufw 2>/dev/null || true') != ''

# ... (Aquí mantienes tus tareas de limpieza de UFW e IPTABLES usando el loop optimizado) ...

- name: Habilitar e iniciar tinyproxy
  ansible.builtin.systemd:
    name: tinyproxy
    enabled: yes
    state: started

- name: Exponer tinyproxy_port y tinyproxy_host a hostvars para otros plays
  ansible.builtin.set_fact:
    tinyproxy_port: "{{ tinyproxy_port }}"
    tinyproxy_host: "{{ (ansible_all_ipv4_addresses | select('match', '^10\\.12\\.') | list | first) | default(ansible_default_ipv4.address) }}"