---
# roles/22storageClass/tasks/main.yml

- name: Eliminar StorageClass existente si el provisioner es diferente (campo inmutable)
  ansible.builtin.shell: |
    EXISTING=$(kubectl get storageclass {{ storage_class_name }} -o jsonpath='{.provisioner}' 2>/dev/null)
    if [ "$EXISTING" != "" ] && [ "$EXISTING" != "{{ storage_class_provisioner }}" ]; then
      kubectl delete storageclass {{ storage_class_name }}
    fi
  changed_when: false
  when: inventory_hostname == groups['kubernetes_masters'][0]

- name: Crear o actualizar la definición del StorageClass en Kubernetes
  ansible.builtin.shell: |
    cat <<'EOF' | kubectl apply -f -
    apiVersion: storage.k8s.io/v1
    kind: StorageClass
    metadata:
      name: {{ storage_class_name }}
      annotations:
        storageclass.kubernetes.io/is-default-class: "true"
    provisioner: {{ storage_class_provisioner }}
    reclaimPolicy: {{ storage_class_reclaim_policy }}
    volumeBindingMode: {{ storage_class_binding_mode }}
    allowVolumeExpansion: {{ storage_class_allow_expansion | string | lower }}
    EOF

- name: Obtener el estado actual de los StorageClasses del clúster
  ansible.builtin.command: kubectl get storageclass
  register: storageclass_status
  until: '"leader changed" not in storageclass_status.stderr'
  retries: 5
  delay: 5
  changed_when: false

- name: Mostrar el listado de StorageClasses activos
  ansible.builtin.debug:
    var: kubectl_sc_output.stdout_lines
  when: inventory_hostname == groups['kubernetes_masters'][0]
