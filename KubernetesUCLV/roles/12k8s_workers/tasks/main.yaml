---
# roles/12k8s_workers/tasks/main.yml

# ==============================================================================
# 0. LIMPIEZA TOTAL Y RESET DEL ESTADO PREVIO
# ==============================================================================
- name: Forzar el reset de kubeadm en el nodo trabajador
  ansible.builtin.command: kubeadm reset -f
  register: kubeadm_reset_result
  changed_when: true

- name: Eliminar directorios de certificados antiguos para evitar conflictos TLS
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/kubernetes/pki
    - /var/lib/kubelet/pki
    - /etc/kubernetes/kubelet.conf

# ==============================================================================
# 1. UNIÓN AL CLÚSTER (Uso de variable en memoria compartida)
# ==============================================================================
- name: Unir el nodo trabajador al clúster de Kubernetes
  ansible.builtin.command: "{{ hostvars['k8s_shared']['shared_worker_join_cmd'] }}"
  register: worker_join_result

# ==============================================================================
# 2. VERIFICACIÓN Y PERSISTENCIA DEL SERVICIO
# ==============================================================================
- name: Asegurar que el servicio kubelet esté habilitado y corriendo correctamente
  ansible.builtin.systemd:
    name: kubelet
    state: started
    enabled: true

# ==============================================================================
# 3. LOG / DEBUGGING
# ==============================================================================
- name: Mostrar el comando de join utilizado (Solo con verbosidad -v o debug)
  ansible.builtin.debug:
    msg: "Nodo unido usando el comando: {{ hostvars['k8s_shared']['shared_worker_join_cmd'] }}"